<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17263c"><meta name="description" content="SketchPad: Offline Zeichnen und technische Skizzen mit Stift"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>SketchPad</title></head><body>
<header><button id="menu" title="Projekte">☰</button><strong>SketchPad</strong><input id="docname" aria-label="Zeichnungsname" value="Neue Skizze"><span class="grow"></span><button id="undo" title="Rückgängig">↶</button><button id="redo" title="Wiederholen">↷</button><button id="fit" title="Ansicht anpassen">⌗</button><button id="more" title="Optionen">⋮</button></header>
<main><aside id="tools"><button data-tool="pen" class="active" title="Stift">✎</button><button data-tool="eraser" title="Radierer">◫</button><button data-tool="line" title="Linie">╱</button><button data-tool="rect" title="Rechteck">▢</button><button data-tool="ellipse" title="Ellipse">◯</button><button data-tool="measure" title="Maßlinie">↔</button><button data-tool="pan" title="Verschieben">✥</button></aside><section id="workspace"><canvas id="canvas" aria-label="Zeichenfläche"></canvas><div id="status">100 % · Stift</div></section></main>
<footer><label>Farbe <input id="color" type="color" value="#22334b"></label><label>Stärke <input id="width" type="range" min="1" max="24" value="3"><output id="widthout">3</output></label><label>Papier <select id="paper"><option value="infinite">Unendlich</option><option value="a4p">A4 hoch</option><option value="a4l">A4 quer</option><option value="a3p">A3 hoch</option><option value="a3l">A3 quer</option></select></label><label><input id="grid" type="checkbox" checked> Raster</label><label><input id="stylus" type="checkbox" checked> Nur Stift*</label></footer>
<dialog id="options"><h2>Zeichnung & Projekte</h2><div class="buttons"><button id="new">Neue Zeichnung</button><button id="projects">Projekte öffnen</button><button id="save">Jetzt speichern</button><button id="png">PNG exportieren</button><button id="pdf">PDF drucken/speichern</button><button id="json">Projekt exportieren</button><button id="importbtn">Projekt importieren</button><input id="import" type="file" accept=".json,application/json" hidden></div><p class="hint">* Bei erkanntem Eingabestift werden Finger zum Verschieben/Zoomen verwendet. Ohne Stift kannst du die Option ausschalten. Daten bleiben lokal in diesem Browser. Sichere wichtige Projekte zusätzlich als JSON.</p><button id="close">Schließen</button></dialog>
<dialog id="projectdialog"><h2>Gespeicherte Projekte</h2><div id="projectlist"></div><button id="closeprojects">Schließen</button></dialog>
<script src="app.js" defer></script></body></html>
